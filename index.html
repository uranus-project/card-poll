<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171923">
  <meta name="description" content="A community Yu-Gi-Oh! card poll.">
  <title>Yu-Gi-Oh! Card Poll</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11131b; color: #f4f4f7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 620px); padding: clamp(28px, 6vw, 52px); border: 1px solid #343849; border-radius: 20px; background: #1a1d29; box-shadow: 0 24px 80px #0006; }
    .eyebrow { color: #a8add0; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.05; }
    p { color: #c5c8d5; line-height: 1.65; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 18px; padding: 9px 13px; border: 1px solid #454b60; border-radius: 999px; color: #dfe2f2; font-size: .9rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #e5b85c; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Uranus Project</div>
    <h1>Yu-Gi-Oh!<br>Card Poll</h1>
    <p>This is the home of our community card poll. The voting interface is being prepared; check back soon.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span> Poll coming soon</div>
  </main>
</body>
</html>
